name: Build Geode Mod (Android Only)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Geode SDK
        run: |
          curl -L https://github.com/geode-sdk/cli/releases/latest/download/geode-cli-linux.zip -o geode.zip
          unzip geode.zip -d $HOME/geode-cli
          chmod +x $HOME/geode-cli/geode
          echo "$HOME/geode-cli" >> $GITHUB_PATH
          geode sdk install
          geode sdk install-binaries -p android64

      - name: Patch fmt (HACK for NDK r29)
        run: |
          FMT_DIR=$(find $HOME/.geode/sdk/cpm-cache/fmt -name "format.h" -path "*/include/fmt/*" | head -1 | xargs dirname)
          if [ -n "$FMT_DIR" ]; then
            sed -i 's/constexpr auto operator"" _a/constexpr auto operator""_a/g' $FMT_DIR/format.h
            sed -i 's/#define FMT_CONSTEVAL consteval/#define FMT_CONSTEVAL constexpr/g' $FMT_DIR/base.h
            echo "fmt patched"
          fi

      - name: Configure
        run: |
          cmake -B build             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_CXX_FLAGS="-DFMT_CONSTEVAL=constexpr -Wno-deprecated-literal-operator"             -DGEODE_SDK=$HOME/.geode/sdk             -T Android64

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbot-android64
          path: build/*.geode