name: Build Geode Mod (Android Only)

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Geode Mod
        id: build
        continue-on-error: true
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: nightly
          build-config: Release
          target: Android64
          combine: false
          use-lto: false
          export-symbols: false

      - name: Patch fmt and retry
        if: steps.build.outcome == 'failure'
        run: |
          # Find fmt headers
          FMT_FILES=$(find . $HOME/.geode/sdk -path "*/fmt/*/include/fmt/*.h" 2>/dev/null)
          for f in $FMT_FILES; do
            sed -i 's/constexpr auto operator"" _a/constexpr auto operator""_a/g' "$f" 2>/dev/null || true
            sed -i 's/#define FMT_CONSTEVAL consteval/#define FMT_CONSTEVAL constexpr/g' "$f" 2>/dev/null || true
          done
          # Retry build
          cmake --build build --config Release --parallel 4

      - name: Upload Artifact
        if: success() || steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: deepbot-android64
          path: build/*.geode