name: Build deepbot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Geode SDK
        uses: actions/cache@v4
        with:
          path: ~/geode-sdk
          key: geode-sdk-android64-v4-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            geode-sdk-android64-v4-

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Download & Install Geode SDK
        run: |
          export GEODE_SDK=$HOME/geode-sdk
          mkdir -p $GEODE_SDK
          
          # Download SDK source (zipball of repo)
          if [ ! -d "$GEODE_SDK/CMakeLists.txt" ]; then
            curl -L "https://github.com/geode-sdk/geode/archive/refs/tags/v5.8.2.zip" -o /tmp/geode-src.zip
            unzip -o /tmp/geode-src.zip -d /tmp/geode-src
            cp -r /tmp/geode-src/geode-5.8.2/* $GEODE_SDK/
          fi
          
          # Download prebuilt Android64 binaries
          mkdir -p $GEODE_SDK/bin
          curl -L "https://github.com/geode-sdk/geode/releases/download/v5.8.2/geode-v5.8.2-android64.zip" -o /tmp/geode-bin.zip
          unzip -o /tmp/geode-bin.zip -d $GEODE_SDK/bin/
          
          # Fix Codegen permissions
          find $GEODE_SDK -name "Codegen" -type f -exec chmod +x {} \; 2>/dev/null || true
          find $GEODE_SDK -name "codegen" -type f -exec chmod +x {} \; 2>/dev/null || true
          
          echo "GEODE_SDK=$GEODE_SDK" >> $GITHUB_ENV

      - name: Configure & Build
        run: |
          cmake -B build \
            -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEODE_TARGET_PLATFORM=Android64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21
          cmake --build build --config Release -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbot-android64
          path: build/**/*.geode
