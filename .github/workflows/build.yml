name: Build deepbot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Geode SDK
        uses: actions/cache@v4
        with:
          path: ~/.geode
          key: geode-sdk-android64-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            geode-sdk-android64-

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Install Geode CLI
        run: |
          # Download latest CLI from GitHub API
          CLI_URL=$(curl -s https://api.github.com/repos/geode-sdk/cli/releases/latest | grep "browser_download_url.*linux-x64" | cut -d '"' -f 4)
          curl -L "$CLI_URL" -o /tmp/geode-cli.tar.gz
          tar xzf /tmp/geode-cli.tar.gz -C /tmp
          sudo mv /tmp/geode /usr/local/bin/
          geode --version

      - name: Install SDK & Fix Codegen
        run: |
          geode sdk install
          geode sdk install-binaries
          # Find and fix Codegen permissions
          CODEGEN_PATH=$(find ~/.geode -name "Codegen" -type f 2>/dev/null | head -1)
          if [ -n "$CODEGEN_PATH" ]; then
            chmod +x "$CODEGEN_PATH"
            echo "Fixed permissions for: $CODEGEN_PATH"
          fi
          # Also fix any codegen in build directory
          mkdir -p build
          find build -name "Codegen" -type f -exec chmod +x {} \; 2>/dev/null || true

      - name: Configure & Build
        run: |
          export GEODE_SDK=$(geode sdk path)
          cmake -B build \
            -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DGEODE_TARGET_PLATFORM=Android64 \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-21
          cmake --build build --config Release -j$(nproc)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbot-android64
          path: build/**/*.geode
