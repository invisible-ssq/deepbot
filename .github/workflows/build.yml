name: Build deepbot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Android64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache Geode SDK
        uses: actions/cache@v4
        with:
          path: ~/.geode
          key: geode-sdk-android64-v16-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            geode-sdk-android64-v16-

      - name: Setup NDK r28b
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28b
          add-to-path: true

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: Android64
          sdk: 5.8.2
          cmake-args: "-DANDROID_PLATFORM=android-23"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbot-android64
          path: build/**/*.geode
