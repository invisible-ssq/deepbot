name: Build deepbot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: Android64
            os: ubuntu-latest
            target: Android64

    steps:
      - uses: actions/checkout@v4

      - name: Setup Geode CLI
        uses: geode-sdk/cli@main
        with:
          version: 3.8.0

      - name: Install Geode SDK
        run: |
          geode sdk install
          geode sdk install-binaries
        env:
          GEODE_SDK: ${{ github.workspace }}/geode-sdk

      - name: Fix Codegen permissions (Unix)
        if: runner.os != 'Windows'
        run: |
          find ${{ github.workspace }}/geode-sdk -name "Codegen" -type f -exec chmod +x {} \; 2>/dev/null || true
          find ${{ github.workspace }}/build -name "Codegen" -type f -exec chmod +x {} \; 2>/dev/null || true

      - name: Build (Windows)
        if: matrix.config.target == 'Win64'
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DGEODE_TARGET_PLATFORM=Win64
          cmake --build build --config Release -j4

      - name: Build (Android64)
        if: matrix.config.target == 'Android64'
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DGEODE_TARGET_PLATFORM=Android64 -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21
          cmake --build build --config Release -j4

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: deepbot-${{ matrix.config.target }}
          path: build/**/*.geode

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        run: |
          mkdir -p package
          cp artifacts/**/*.geode package/ 2>/dev/null || true

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: deepbot_package
          path: package/*.geode
